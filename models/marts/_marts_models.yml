version: 2

models:
  - name: obt_rendimiento_agricola
    description: "One Big Table (OBT) que consolida el rendimiento agrícola por cultivo e indicadores de valor agregado macro."
    columns:
      - name: id_rendimiento
        tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 32 # <-- Anidado debajo de arguments

      - name: cultivo
        tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$' # <-- Anidado debajo de arguments

      - name: anio
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 2017
                max_value: 2026 # <-- Anidado debajo de arguments

      - name: superficie_ha
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1 # Obliga a que sea mayor a 0 hectáreas
              row_condition: "superficie_ha IS NOT NULL"